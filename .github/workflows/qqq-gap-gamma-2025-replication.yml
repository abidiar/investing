name: QQQ 2025 Gap Gamma Time-Shift Replication

on:
  push:
    branches: [main]
    paths:
      - 'research/run_qqq_gap_gamma_2025_replication.py'
      - 'research/qqq_gap_gamma_2025_replication_v1.md'
      - '.github/workflows/qqq-gap-gamma-2025-replication.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Investing OS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: pip install pandas numpy scipy yfinance pyarrow tabulate

      - name: Fetch independent QQQ 2025 options dataset
        run: |
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/qqq/options_2025.parquet \
            -o /tmp/qqq_options_2025.parquet
          ls -lh /tmp/qqq_options_2025.parquet

      - name: Run frozen QQQ 2025 gap-gamma replication
        env:
          QQQ_2025_OPTIONS_PARQUET: /tmp/qqq_options_2025.parquet
        run: |
          mkdir -p research/results
          python research/run_qqq_gap_gamma_2025_replication.py | tee research/results/qqq_gap_gamma_2025_replication_v1_run.log

      - name: Commit reproducible results
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/results/qqq_gap_gamma_2025_replication_v1_*.csv research/results/qqq_gap_gamma_2025_replication_v1_*.md research/results/qqq_gap_gamma_2025_replication_v1_run.log
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Record frozen QQQ 2025 gap-gamma replication results [skip ci]'
            git push
          fi

name: Earnings Recovery DoltHub Free 2025 EOD Quotes
on:
  push:
    branches: [main]
    paths:
      - 'research/earnings_recovery/run_dolthub_four_event_2026-10-10.py'
      - '.github/workflows/earnings-recovery-dolthub-free-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-recovery-dolthub-free-2025
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query free archived 2025 issuer option chains without account
        run: python research/earnings_recovery/run_dolthub_four_event_2026-10-10.py
      - name: Commit exact chain response and missing cases
        if: always()
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f research/earnings_recovery/dolthub_four_event_eod_chain_2026-10-10.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Archive 2025 free DoltHub options EOD bid ask for four frozen events [skip ci]'
            git push
          fi

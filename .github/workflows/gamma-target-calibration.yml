name: Gamma Target Calibration Research

on:
  push:
    branches: [main]
    paths:
      - 'research/gamma_target_calibration_v1.md'
      - 'research/run_gamma_target_calibration.py'
      - '.github/workflows/gamma-target-calibration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Investing OS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: pip install pandas numpy scikit-learn yfinance pyarrow tabulate

      - name: Fetch 2011-2013 SPY QQQ IWM options datasets
        run: |
          mkdir -p /tmp/options_gamma_target
          for sym in spy qqq iwm; do
            for year in 2011 2012 2013; do
              echo "Fetching ${sym} ${year}"
              curl -L --fail --retry 3 \
                "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/${sym}/options_${year}.parquet" \
                -o "/tmp/options_gamma_target/${sym}_${year}.parquet"
            done
          done
          ls -lh /tmp/options_gamma_target

      - name: Run frozen target-calibration falsification
        env:
          OPTIONS_DATA_DIR: /tmp/options_gamma_target
        run: |
          mkdir -p research/results
          python research/run_gamma_target_calibration.py | tee research/results/gamma_target_calibration_v1_run.log

      - name: Commit reproducible results
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/results/gamma_target_calibration_v1_*.csv research/results/gamma_target_calibration_v1_*.md research/results/gamma_target_calibration_v1_run.log
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Record frozen gamma target-calibration results [skip ci]'
            git push
          fi

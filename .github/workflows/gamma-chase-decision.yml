name: Gamma Compression Chase Decision Research

on:
  push:
    branches: [main]
    paths:
      - 'research/gamma_chase_decision_v1.md'
      - 'research/run_gamma_chase_decision.py'
      - '.github/workflows/gamma-chase-decision.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout Investing OS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: pip install pandas numpy yfinance pyarrow tabulate scikit-learn

      - name: Fetch 2014-2019 SPY QQQ IWM options datasets
        run: |
          mkdir -p /tmp/options_gamma_chase
          for sym in spy qqq iwm; do
            for year in 2014 2015 2016 2017 2018 2019; do
              echo "Fetching ${sym} ${year}"
              curl -L --fail --retry 3 \
                "https://raw.githubusercontent.com/anahatsingh-ui/options-dataset-hist/main/${sym}/options_${year}.parquet" \
                -o "/tmp/options_gamma_chase/${sym}_${year}.parquet"
            done
          done
          ls -lh /tmp/options_gamma_chase

      - name: Run frozen chase-decision falsification
        env:
          OPTIONS_DATA_DIR: /tmp/options_gamma_chase
        run: |
          mkdir -p research/results
          python research/run_gamma_chase_decision.py | tee research/results/gamma_chase_decision_v1_run.log

      - name: Commit reproducible results
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/results/gamma_chase_decision_v1_*.csv research/results/gamma_chase_decision_v1_*.md research/results/gamma_chase_decision_v1_run.log
          if git diff --cached --quiet; then
            echo 'No result changes to commit.'
          else
            git commit -m 'Record frozen gamma chase decision results [skip ci]'
            git push
          fi

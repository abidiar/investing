name: Earnings 2025 Prior-Close Nonlookahead Option Selection
on:
  push:
    branches: [main]
    paths:
      - 'research/earnings_recovery/run_nonlookahead_priorclose_2025_55events_2026-10-10.py'
      - '.github/workflows/earnings-priorclose-nonlookahead-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: earnings-priorclose-nonlookahead-2025
  cancel-in-progress: false
jobs:
  prior-close-selection:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use exclusively prior-date free stock close and options chain snapshots
        run: python research/earnings_recovery/run_nonlookahead_priorclose_2025_55events_2026-10-10.py
      - name: Save historical no-lookahead selection and raw option snapshot evidence
        if: always()
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f research/earnings_recovery/nonlookahead_priorclose_2025_55events_selections_2026-10-10.json research/earnings_recovery/nonlookahead_priorclose_2025_55events_rawchains_2026-10-10.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Save 2025 55-event historical prior-close call selection without same-day lookahead [skip ci]'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              git push && break
              sleep 2
            done
          fi

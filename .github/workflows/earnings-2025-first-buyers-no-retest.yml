name: Frozen 2025 Two-Green Buyer Initiative No-Retest Earnings Test
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earnings-2025-first-buyers-no-retest.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frozen-2025-two-green-buyer-no-retest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify fixed 40-event roster, signal rules and provider source files
        run: |
          test -f research/earnings_recovery/frozen_2025_jul_aug_40_announcements_for_first_buyer_initiative_2026-10-10.json
          test -f research/earnings_recovery/frozen_2025_first_buyer_initiative_without_retest_protocol_2026-10-10.md
          test -f research/earnings_recovery/buyer_initiative_2025_frozen_raw_m5_week2025-07-07_2026-10-10.json
          git log -1 --format="%h %s" -- research/earnings_recovery/frozen_2025_first_buyer_initiative_without_retest_protocol_2026-10-10.md
      - name: Test first two bullish five-minute bars with volume follow-through, no low retest
        run: python research/earnings_recovery/run_frozen_2025_early_two_green_buyers_without_low_retest.py
      - name: Permanently archive all stock results, including no-trade/missing
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add research/earnings_recovery/first_buyer_initiative_no_retest_2025_40events_results_2026-10-10.json
          git commit -m 'Archive frozen 2025 full historical intraday buyer initiative outcomes [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            git push && break
            sleep 2
          done

name: Earnings OTM Other Historical Data Source Probe
on:
  push:
    branches: [main]
    paths:
      - 'research/earnings_recovery/run_onclickmedia_four_event_feasibility_2026-10-10.py'
      - '.github/workflows/earnings-otm-onclick-feasibility.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch free historical EOD option research data (no API keys)
        run: |
          python research/earnings_recovery/run_onclickmedia_four_event_feasibility_2026-10-10.py
      - name: Save date-specific data feasibility result to Investing OS
        if: always()
        run: |
          git config user.name 'Investing OS Research Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -f research/earnings_recovery/onclickmedia_four_event_feasibility_2026-10-10.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'Archive four-event alternative historical options source feasibility [skip ci]'
            git push
          fi
